          <circle cx="1084" cy="532" r="9" fill="none" stroke="#0F172A" stroke-width="1"/>
          <ellipse cx="1084" cy="532" rx="4" ry="9" fill="none" stroke="#0F172A" stroke-width="1"/>
          <line x1="1075" y1="532" x2="1093" y2="532" stroke="#0F172A" stroke-width="1"/>

    </g>

    <rect x="0" y="0" width="1180" height="2" fill="#2563EB" opacity="0.05">
      <animate attributeName="y" values="0;610;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.1;0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- ============ LEFT PANEL — ASCII PORTRAIT ============ -->
    <g>
      <rect x="36" y="36" width="404" height="538" rx="18" fill="#F8FAFC" stroke="rgba(15,23,42,0.08)"/>
      <g font-family="'Fira Code','Consolas',monospace" font-size="13.5" fill="url(#asciiGradL)" xml:space="preserve">
        <g><text x="70" y="120">    .-\"\"\"\"\"-.</text><animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="144">   /  ..   ..  \</text><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="168">  |   O    O   |</text><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="192">  |     ^      |     root@Asif</text><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="216">   \   ---   /       booting...</text><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="240">    '-.....-'</text><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="264">   / |||||| \</text><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="288">  /==||||||==\</text><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="312"> /____________\</text><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="336"> [ SEC ][ OPS ]</text><animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="360"> |_|          |_|</text><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="384"> access: root</text><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/></g>
        <g><text x="70" y="408"> status: active_</text><animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.4s" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" begin="4.1s" dur="5s" repeatCount="indefinite"/>
        </g>

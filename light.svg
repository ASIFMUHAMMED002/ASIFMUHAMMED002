      <text x="504" y="344" font-family="'Inter',sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#0F172A" opacity="0">SKILLS
        <animate attributeName="opacity" from="0" to="1" begin="5.1s" dur="0.4s" fill="freeze"/>
      </text>

      <g font-family="'Inter',sans-serif" font-size="13" fill="#0F172A">
        <g opacity="0">
          <rect x="504" y="356" width="620" height="30" rx="15" fill="rgba(37,99,235,0.06)" stroke="url(#pillGradL)" filter="url(#glowL)"/>
          <text x="524" y="376">🌐 Networking</text>

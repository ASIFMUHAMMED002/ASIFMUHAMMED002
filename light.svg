        <text x="504" y="200" clip-path="url(#typeClip0L)" textLength="337" lengthAdjust="spacingAndGlyphs">&gt; Aspiring Cybersecurity Analyst</text>
        <text x="504" y="200" clip-path="url(#typeClip1L)" textLength="255" lengthAdjust="spacingAndGlyphs">&gt; SOC Analyst in Training</text>
        <text x="504" y="200" clip-path="url(#typeClip2L)" textLength="224" lengthAdjust="spacingAndGlyphs">&gt; Blue Team Enthusiast</text>

      <rect x="700" y="-120" width="550" height="500" fill="url(#blobCyanL)">
        <animateTransform attributeName="transform" type="translate" values="0,0; -15,20; 0,0" dur="11s" repeatCount="indefinite"/>
      </rect>
      <rect x="400" y="150" width="600" height="500" fill="url(#blobEmeraldL)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 10,-15; 0,0" dur="10s" repeatCount="indefinite"/>

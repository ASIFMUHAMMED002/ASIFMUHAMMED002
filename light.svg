          <animate attributeName="opacity" from="0" to="1" begin="5.7s" dur="0.4s" fill="freeze"/>
        </g>
        <g opacity="0">
          <rect x="504" y="470" width="620" height="30" rx="15" fill="rgba(37,99,235,0.06)" stroke="url(#pillGradL)" filter="url(#glowL)"/>
          <text x="524" y="490">⌨️ Scripting: Python · Bash · PowerShell · Git</text>
          <animate attributeName="opacity" from="0" to="1" begin="5.9s" dur="0.4s" fill="freeze"/>
        </g>
      </g>

      <g opacity="0" font-family="'Inter',sans-serif">
        <animate attributeName="opacity" from="0" to="1" begin="6.2s" dur="0.5s" fill="freeze"/>

        <g filter="url(#glowL)">
          <circle cx="964" cy="532" r="14" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
          <path transform="translate(954,522) scale(0.0390625)" fill="#0F172A" d="M256 32C132.3 32 32 132.3 32 256c0 98.2 63.7 181.5 152.1 210.9 11.1 2.1 15.1-4.8 15.1-10.7 0-5.3-.2-19.3-.3-37.9-61.9 13.4-75-29.8-75-29.8-10.1-25.7-24.7-32.6-24.7-32.6-20.2-13.8 1.5-13.5 1.5-13.5 22.3 1.6 34.1 22.9 34.1 22.9 19.9 34 52.1 24.2 64.8 18.5 2-14.4 7.8-24.2 14.1-29.8-49.4-5.6-101.4-24.7-101.4-109.9 0-24.3 8.7-44.1 22.9-59.7-2.3-5.6-9.9-28.3 2.2-59 0 0 18.7-6 61.2 22.8 17.8-4.9 36.8-7.4 55.7-7.5 18.9.1 37.9 2.6 55.7 7.5 42.5-28.8 61.2-22.8 61.2-22.8 12.1 30.7 4.5 53.4 2.2 59 14.2 15.6 22.8 35.4 22.8 59.7 0 85.4-52.1 104.2-101.7 109.7 8 6.9 15.1 20.5 15.1 41.3 0 29.9-.3 54-.3 61.3 0 5.9 4 12.9 15.2 10.7C424.4 437.4 488 354.1 488 256 488 132.3 387.7 32 256 32z"/>
        </g>

        <g filter="url(#glowL)">
